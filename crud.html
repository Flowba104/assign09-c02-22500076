<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>도서 관리</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>📚 도서 관리</h1>
      <a href="index.html">← 홈으로</a>
    </header>

    <!-- 등록 / 수정 폼 -->
    <section class="card">
      <h2 id="form-title">도서 등록</h2>
      <form id="book-form" novalidate>
        <label>제목
          <input type="text" id="title" placeholder="예: 클린 코드" />
        </label>
        <label>저자
          <input type="text" id="author" placeholder="예: 로버트 C. 마틴" />
        </label>
        <label>장르
          <select id="genre">
            <option value="">-- 선택 --</option>
            <option value="소설">소설</option>
            <option value="IT">IT</option>
            <option value="경제">경제</option>
            <option value="자기계발">자기계발</option>
            <option value="기타">기타</option>
          </select>
        </label>
        <label>가격(원)
          <input type="number" id="price" placeholder="예: 25000" />
        </label>
        <label>평점(1~5)
          <input type="number" id="rating" placeholder="예: 4" />
        </label>

        <div class="form-actions">
          <button type="submit" class="btn primary" id="submit-btn">등록</button>
          <button type="button" class="btn" id="cancel-btn" hidden>수정 취소</button>
        </div>
      </form>
    </section>

    <!-- 메시지 -->
    <p id="message" class="message"></p>

    <!-- 검색 + 목록 -->
    <section class="card">
      <div class="list-header">
        <h2>도서 목록</h2>
        <input type="search" id="search" placeholder="제목 또는 저자로 검색" />
      </div>
      <table>
        <thead>
          <tr>
            <th>제목</th>
            <th>저자</th>
            <th>장르</th>
            <th>가격</th>
            <th>평점</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="book-list"></tbody>
      </table>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
